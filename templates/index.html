<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP KILLER 1000MB</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .panel { border: 1px solid #0f0; padding: 20px; border-radius: 5px; width: 90%; max-width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #111; border: 1px solid #0f0; color: #0f0; box-sizing: border-box; }
        button { width: 100%; padding: 15px; cursor: pointer; font-weight: bold; border: none; margin-top: 5px; }
        .on { background: #0f0; color: #000; }
        .off { background: #f00; color: #fff; }
        .st { margin-top: 20px; font-size: 0.8rem; border-top: 1px solid #333; padding-top: 10px; }
        #total { font-size: 2rem; color: #fff; display: block; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="panel">
        <h3>REAL IP INJECTOR</h3>
        <input type="text" id="target" placeholder="ESCRIBE IP REAL">
        <input type="number" id="threads" placeholder="CANTIDAD BOTS" value="10">
        
        <button class="on" onclick="run('start')">INICIAR LOOP (1GB)</button>
        <button class="off" onclick="run('stop')">DETENER</button>

        <div class="st">
            IP OBJETIVO: <span id="cur_ip">0.0.0.0</span><br>
            <span id="total">0</span>
            MB ENVIADOS
            <br>BOTS ACTIVOS: <span id="hilos">0</span>
        </div>
    </div>

    <script>
        async function run(a) {
            await fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: a,
                    target: document.getElementById('target').value,
                    threads: document.getElementById('threads').value
                })
            });
        }
        setInterval(async () => {
            const r = await fetch('/api/stats');
            const d = await r.json();
            document.getElementById('total').innerText = d.total_mb.toLocaleString();
            document.getElementById('hilos').innerText = d.hilos;
            document.getElementById('cur_ip').innerText = d.ip;
        }, 1000);
    </script>
</body>
</html>
