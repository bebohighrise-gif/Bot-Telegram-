<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Bot Terminal</title>
    <style>
        :root { --neon: #00ff88; --bg: #050505; --red: #ff3e3e; }
        * { box-sizing: border-box; transition: 0.3s; }
        body { 
            background: var(--bg); color: var(--neon); 
            font-family: 'Courier New', monospace; margin: 0; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container { 
            width: 90%; max-width: 500px; background: #0f0f0f; 
            padding: 30px; border: 1px solid var(--neon);
            border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        h1 { font-size: 1.5rem; text-align: center; text-transform: uppercase; letter-spacing: 3px; }
        .status-bar { 
            background: #000; padding: 10px; border-radius: 5px; 
            margin-bottom: 20px; font-size: 0.8rem; border-left: 3px solid var(--neon);
        }
        input { 
            width: 100%; background: #000; border: 1px solid #333; 
            color: #fff; padding: 12px; margin: 10px 0; border-radius: 5px; outline: none;
        }
        input:focus { border-color: var(--neon); box-shadow: 0 0 10px rgba(0, 255, 136, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { 
            padding: 15px; border: none; border-radius: 5px; 
            font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .btn-start { background: var(--neon); color: #000; }
        .btn-stop { background: var(--red); color: #fff; }
        button:active { transform: scale(0.95); }
        .stats-display { 
            margin-top: 25px; display: flex; justify-content: space-around; 
            border-top: 1px solid #222; padding-top: 20px;
        }
        .stat-box { text-align: center; }
        .stat-box small { display: block; color: #555; font-size: 0.7rem; }
        .stat-box span { font-size: 1.2rem; font-weight: bold; }
        
        /* Mobile adjustment */
        @media (max-width: 400px) {
            h1 { font-size: 1.2rem; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Core Hoster v2</h1>
        <div class="status-bar">SYSTEM STATUS: <span id="status">OFFLINE</span></div>
        
        <label>TARGET IP / URL</label>
        <input type="text" id="target" placeholder="ej: 192.168.1.1 o https://web.com">
        
        <label>CANTIDAD DE BOTS</label>
        <input type="number" id="threads" placeholder="Número de hilos" value="10">
        
        <div class="grid">
            <button class="btn-start" onclick="control('start')">Iniciar</button>
            <button class="btn-stop" onclick="control('stop')">Detener</button>
        </div>

        <div class="stats-display">
            <div class="stat-box">
                <span><span id="st_total">0</span>MB</span>
                <small>ENVIADO</small>
            </div>
            <div class="stat-box">
                <span id="st_hilos">0</span>
                <small>BOTS ACTIVOS</small>
            </div>
        </div>
    </div>

    <script>
        async function control(action) {
            const res = await fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: action,
                    target: document.getElementById('target').value,
                    threads: document.getElementById('threads').value
                })
            });
        }

        setInterval(async () => {
            const r = await fetch('/api/stats');
            const d = await r.json();
            document.getElementById('st_total').innerText = d.total_mb;
            document.getElementById('st_hilos').innerText = d.hilos;
            document.getElementById('status').innerText = d.status;
            
            const statusNode = document.getElementById('status');
            statusNode.style.color = d.status === 'ATTACKING' ? '#00ff88' : '#ff3e3e';
        }, 1000);
    </script>
</body>
</html>
