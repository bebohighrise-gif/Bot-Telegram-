<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IP Killer Pro</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding: 20px; }
        .card { border: 1px solid #0f0; padding: 20px; border-radius: 10px; max-width: 380px; margin: auto; background: #050505; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #111; border: 1px solid #0f0; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin: 5px 0; cursor: pointer; font-weight: bold; border: none; text-transform: uppercase; }
        .start { background: #0f0; color: #000; }
        .stop { background: #f00; color: #fff; }
        #total { font-size: 2.2em; color: #fff; display: block; margin: 10px 0; }
        .info { font-size: 0.9em; opacity: 0.8; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>IP INJECTOR REAL</h3>
        <input type="text" id="target" placeholder="IP OBJETIVO">
        <input type="number" id="threads" placeholder="BOTS" value="10">
        
        <button class="start" onclick="send('start')">Lanzar Ataque</button>
        <button class="stop" onclick="send('stop')">Detener Todo</button>

        <div class="info">
            DESTINO: <span id="ip">0.0.0.0</span><br>
            <span id="total">0</span> MB ENVIADOS<br>
            HILOS ACTIVOS: <span id="hilos">0</span>
        </div>
    </div>

    <script>
        async function send(a) {
            const t = document.getElementById('target').value;
            const h = document.getElementById('threads').value;
            try {
                await fetch('/api/control', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({action: a, target: t, threads: h})
                });
            } catch(e) { alert("Error de conexión"); }
        }
        setInterval(async () => {
            try {
                const r = await fetch('/api/stats');
                const d = await r.json();
                document.getElementById('total').innerText = d.total_mb.toLocaleString();
                document.getElementById('hilos').innerText = d.hilos;
                document.getElementById('ip').innerText = d.ip;
            } catch(e) {}
        }, 1000);
    </script>
</body>
    </html>
